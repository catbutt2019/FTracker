<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Experimental progression tracking and squad-strength forecasting for Republic of Ireland footballers, built on researched player data."
    />
    <title>Ireland Player Progression Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Cloudflare Web Analytics. Cookieless and stores nothing on the visitor's
      device, so it needs no consent banner under GDPR/ePrivacy. The token is
      not a secret — it identifies the hostname, and is designed to sit in
      public client-side HTML.

      Counts the whole catbutt2019.github.io hostname, not just /FTracker/.
      Filter by path in the Cloudflare UI if a second site is ever published
      there. Ad blockers block the beacon, so treat the figures as a floor.
    -->
    <script
      type="module"
      src="https://static.cloudflareinsights.com/beacon.min.js"
      data-cf-beacon='{"token": "0fd03ddab0824a8c91bff12b435cc6f0"}'
    ></script>
  </body>
</html>
